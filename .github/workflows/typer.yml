# Typer – aplikacja z typami (wersja 50: wyniki z Flashscore (wszystkie sporty i ligi, także niższe ligi piłki) i rozliczanie wszystkich rynków Fortuny w hokeju, koszykówce, siatkówce, ręcznej, żużlu i baseballu (poprawny czas gry: regulaminowy/z dogrywką); Superbet jako drugi bukmacher w archiwum (naprawione mieszanie z Fortuną), Zbieracz Superbetu bez kombinacji; Pinnacle za darmo – zbieranie ostrych kursów i kursów zamknięcia wszystkich sportów (test dostępu); ochrona kredytów Odds API (wspólny dzienny limit, wyniki najpierw za darmo z FotMob/Flashscore); repo bez plików __pycache__; wersja 49: widok na laptopie (≥1100 px – karty w 2–3 kolumnach, telefon bez zmian); rozliczanie kursów pozostałych sportów (tenis, walki, hokej, koszykówka, baseball, siatkówka) z własnej bazy wyników → archiwum/rozliczone_inne; wersja 48: Superbet – cała oferta 11 sportów 2× dziennie do bazy; samonaprawa pominiętych odczytów Zbieracza (dziś: powtórka popołudnia po błędzie z v44); archiwum piłki – lista FotMob z 3 dni, lepsze dopasowanie nazw (U19/rezerwy/kobiety), bez fałszywych dopasowań; baza wyników bez nieistniejącego źródła boksu; wersja 47: Analityk Pro – korekta skrzywienia AI także w tenisie i walkach, naprawiony błąd analiz tenis/walki z v44; wersja 46: BAZA DANYCH – Zbieracz rano i po południu czyta całą ofertę Fortuny 11 sportów programu (piłka, tenis, MMA, boks, siatkówka, koszykówka, F1, baseball, hokej, piłka ręczna, żużel; walki i nowe dyscypliny z surowymi rynkami), naprawiony błąd trybu rano/po południu z v43, zbiornik wyników wszystkich dyscyplin (ESPN + FotMob → archiwum/wyniki), archiwum piłki ponawia rozliczenie 7 dni i zapisuje diagnostykę dopasowań, stan zbierania w Ustawieniach; wersja 45: „Ocena niepełna” zamiast fałszywego „Ryzyka niespodzianki”, nowy werdykt Analityka Pro przy zmianie typu głównego (krok sędziego na zapamiętanej analizie), poprawiona kontrola nazwisk; wcześniej: wersja 44: Analityk – korekta skrzywienia AI (spłaszczone szanse, zawyżony remis i „poniżej 2,5”) i typ wybierany przez program po korekcie, własny wybór AI liczony osobno; dziennik szans szybkiego Analityka (Flash) przy każdym meczu; Zbieracz rano – wszystkie sporty Fortuny; wersja 43: SKANER SKŁADÓW (skład FotMob 2–4 h, 45–75 min i 3–20 min przed meczem + kursy Fortuny, sklady_lab); wersja 42: numer wersji w Ustawieniach, poprawiony rozkład wyników z kursów; wersja 41: archiwum mecz po meczu, bezpiecznik Value, naprawa odpowiedzi AI; wersja 43: SKANER SKŁADÓW – polski serwer dla każdego meczu piłki z oferty Fortuny zapisuje skład FotMob 2–4 h przed meczem (przewidywany), 45–75 min (kursy + skład, zwykle już ogłoszony) i 3–20 min (kursy zamknięcia + skład), całą dobę; GitHub łączy to z wynikami i liczy, czy kurs w chwili ogłoszenia składu uwzględnia braki (sklady_lab, archiwum/sklady_stat.json), archiwum ma kurs zamknięcia, dosyłka nocnych odczytów rano; wersja 42: numer wersji w Ustawieniach, poprawiony rozkład wyników z kursów (gole i handicapy faworyta, obie strzelą); wersja 41: archiwum rozliczane mecz po meczu, bezpiecznik Value, naprawa odpowiedzi AI; wersja 40: Radar typerów – polski serwer raz dziennie sprawdza 23 serwisy z typami (Blogabet, Tipstrr, OLBG, BettingExpert, Oddsportal, Typersi, Zagranie, BetOnline, Forebet i inne), a 3× dziennie zapisuje ich strony do archiwum (90 dni) – tylko dane do analizy, bez zmian w aplikacji i na Telegramie; wersja 39: sekcja zwłok – po każdej wpadce typu dnia AI szuka sygnałów widocznych przed meczem (Dziennik), serwer zbiera strony Typersi.pl do czytnika typów; wersja 38: analizy Analityka Pro zapamiętywane na 20 h – kolejne uruchomienia tego dnia ich nie gubią; wersja 37: naprawa publikacji – uruchomienie zawsze na najnowszym stanie, konflikt zapisu rozwiązywany całymi plikami, przed publikacją kontrola znaczników konfliktu; Zbieracz kursów – polski serwer czyta całą ofertę Fortuny (piłka, tenis, MMA, boks; wszystkie rynki) rano, po południu i 45–75 min przed meczem, GitHub następnego dnia rozlicza każdy kurs wynikiem z FotMob i liczy, gdzie bukmacher się myli (Dziennik – Archiwum kursów); wersja 36: wariant A – AI łącznie ok. 300 zł/mies.: Flash z nowym poleceniem (za/przeciw, własna szansa, bez przytakiwania) dla wszystkich meczów i analizy ręcznej, Gemini Pro w 3 krokach dla 5 najmocniejszych kandydatów dziennie (3 piłka + 2 tenis/walki) i przycisk „Analiza Pro” w analizie ręcznej (2 dziennie), rynki tenisa/MMA dla Analityka, serwer AI sam dociąga nowe moduły; wersja 35: Analityk AI – Gemini Pro w 3 krokach (analiza na ślepo bez kursów, adwokat diabła, sędzia z argumentami za i przeciw), teczka meczu z FotMob, kontrola faktów, własny typ Analityka i wynik dokładny, dziennik „Czy Analityk bije rynek?”, budżet 150 zł/mies.; wersja 34: korekty Analityka – piłka: ważni zawodnicy poza kadrą z FotMob obniżają szansę drużyny, tenis: przerwa ≥30 dni (wyniki ESPN), MMA: wiek (ufc-master); powód korekty widoczny w karcie meczu; wersja 33: marża z kursów zdejmowana metodą potęgową (piłka, tenis, MMA – nowe kalibracje), w dziennikach najlepszy polski kurs z rana i przed meczem (zysk typów dnia od polskiego kursu, CLV), zamiast zapowiedzi godzinę przed meczem – alarm na Telegramie tylko przy realnej zmianie (spadek szansy, ważny zawodnik poza składem, AI odradza, Value bez przewagi), przeliczenie przed meczem zapisywane do nauki; serwer raz dziennie sprawdza źródła Analityka (FotMob, Sofascore, Transfermarkt, UFCStats); wersja 32: każda pozycja Value (główna i w dyscyplinach) ma własną ocenę AI swojego zakładu – nie ocenę typu z Pewnych; wersja 31: rano czekanie na kursy z serwera do 14 min (wiadomość z kursami wszystkich bukmacherów); Betclic – lepszy dobór lig (polskie nazwy krajów, np. Brasileirão → Brazylia Série A); wersja 30: poranna wiadomość Telegram – po głównych Pewnych i Value pozostałe najpewniejsze typy (🔒) z zakładek każdej dyscypliny, bez powtórzeń; bez gwiazdek przy kursach; wersja 29: Value liczona od najlepszego polskiego kursu (STS, Fortuna, Superbet, Betclic PL) zaraz po pobraniu kursów – rano przed Telegramem i przy każdym odświeżeniu; piłka wszystkie czytane rynki, tenis i walki zwycięzca; rozliczanie każdego rodzaju zakładu; wersja 28: kursy Betclic PL z polskiego serwera bez przeglądarki dla piłki, tenisa, MMA i boksu – Betclic PL w kafelkach, Telegramie i zapowiedziach zamiast francuskiego; „—” = brak zakładu u bukmachera, „?” = nie odczytano; raz dziennie rozpoznanie dodatkowych zakładek Betclic; wersja 27: rozpoznanie zakładek rynków meczu Betclic PL (Wynik, Gole, Sety…), UFC i KSW, test pobierania bez przeglądarki (tryb --betclic2); wersja 26: rozpoznanie całej oferty Betclic PL na polskim serwerze – wszystkie sporty i wszystkie rodzaje zakładów, nasze mecze u Betclic (tryb --betclic); wersja 25: w analizie ręcznej zawsze ocena AI – zgoda z faworytem / ryzyko niespodzianki / AI odradza – z powodem i ocenianym typem; wersja 24: analiza AI przy każdym meczu z Pewnych i Value przez cały dzień (uzupełniana co 30 min, pamięć raportów), budżet Gemini 100 zł/mies. liczony z tokenów, analiza AI przy ręcznej analizie meczu (serwer AI na VPS), ładne kafelki kursów przy wyższym i ryzykownym typie, ponowienie publikacji strony; wersja 23: przy każdym zakładzie komplet kafelków bukmacherów (STS, Fortuna, Superbet, Betclic; „—” = brak w ofercie), STS – pełna oferta wszystkich meczów (subskrypcje paczkami z ponowieniem), Fortuna – „min. 1 set” obu zawodników; na Telegramie typy raz dziennie i zapowiedź ok. godzinę przed meczem z Pewnych i Value; czytelne wyniki po meczu; wersja 22: Fortuna – gole, gole drużyn, handicap i „wynik + gole”, STS – handicap i „wynik + gole”, kursy z polskiego serwera trafiają do aplikacji kilka minut po odczycie; wersja 21: liczenie typów ok. 7:10 i wiadomość ok. 8:00, doba = mecze zaczynające się od 8:00 do 6:00; wersja 20: kursy Fortuny i STS od razu przy nowych typach – liczenie czeka na polski serwer; wersja 19: nowy wygląd, AI z wyszukiwaniem Google ocenia każdy typ, próg 70%, KSW z kursów polskich bukmacherów; wersja 18: STS – pełne rynki meczu). Ten jeden plik instaluje i codziennie uruchamia całą aplikację.
name: Typer
run-name: ${{ inputs.tryb == 'na_zywo' && 'Na żywo' || 'Typer' }}

on:
  push:
    paths: [".github/workflows/typer.yml", "docs/data/kursy_vps.json"]   # kursy_vps.json zapisuje polski serwer → tylko dopisanie kursów
  schedule:
    - cron: "10 5 * * *"   # 7:10 czasu polskiego latem (wiadomość na Telegram ok. 8:00)
    - cron: "10 6 * * *"   # 7:10 czasu polskiego zimą (program sam pomija zbędne uruchomienie)
    - cron: "15,45 6-22 * * *"   # co 30 min: składy i kursy przed meczami, rozliczenia, podsumowanie wieczorne
  workflow_dispatch:
    inputs:
      tryb:
        description: "puste = typy i sprawdzenia; na_zywo = powiadomienia na żywo"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  typy:
    if: inputs.tryb != 'na_zywo'
    concurrency:
      group: typer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # zawsze najnowszy stan (uruchomienie czekające w kolejce nie może pracować na starych danych)
