      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Policz typy
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADRES_APLIKACJI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PLATNY_PLAN: ${{ vars.PLATNY_PLAN }}
        run: python typer/run_daily.py
      - name: Zapisz wyniki
        id: zapis
        run: |
          git config user.name "typer-bot"
          git config user.email "typer-bot@users.noreply.github.com"
          git add -A typer docs requirements.txt README.md
          if git diff --cached --quiet; then echo "zmiany=0" >> "$GITHUB_OUTPUT"; else
            git commit -m "Typy $(date -u +%F\ %H:%M)"; git push; echo "zmiany=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@v5
        if: steps.zapis.outputs.zmiany == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.zapis.outputs.zmiany == '1'
        with:
          path: docs
      - id: deploy
        if: steps.zapis.outputs.zmiany == '1'
        uses: actions/deploy-pages@v4
