# Typer – aplikacja z typami (wersja 63: DARMOWY GEMINI – bez wyszukiwania Google, modele od najmocniejszego do wyczerpania limitu, kolejka: typy dnia każdej dyscypliny, potem Value; Audytor w kodzie; naprawa rozliczania po zmianie czasu (mecz o 2:00 25.10 blokował dziennik piłki))
name: Typer
run-name: ${{ inputs.tryb == 'na_zywo' && 'Na żywo' || 'Typer' }}

on:
  push:
    paths: [".github/workflows/typer.yml", "docs/data/kursy_vps.json"]   # kursy_vps.json zapisuje polski serwer → tylko dopisanie kursów
  schedule:
    - cron: "10 5 * * *"   # 7:10 czasu polskiego latem (wiadomość na Telegram ok. 8:00)
    - cron: "10 6 * * *"   # 7:10 czasu polskiego zimą (program sam pomija zbędne uruchomienie)
    - cron: "27 5,6 * * *"   # wersja 53: zapasowe poranne terminy (GitHub potrafi zgubić uruchomienie)
    - cron: "51 5,6 * * *"
    - cron: "15,45 6-22 * * *"   # co 30 min: składy i kursy przed meczami, rozliczenia, podsumowanie wieczorne
  workflow_dispatch:
    inputs:
      tryb:
        description: "puste = typy i sprawdzenia; na_zywo = powiadomienia na żywo"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  typy:
    if: inputs.tryb != 'na_zywo'
    concurrency:
      group: typer-v59   # wersja 57: nowa nazwa grupy omija uruchomienie zawieszone w kolejce („Queued” od 05.10 11:32)
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # zawsze najnowszy stan (uruchomienie czekające w kolejce nie może pracować na starych danych)
      - name: Rozpakuj aplikacje
        run: |
