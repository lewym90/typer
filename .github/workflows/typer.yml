# Typer – aplikacja z typami (wersja 65: nowy wygląd, funkcje z listy i ikona z lwem)
name: Typer
run-name: ${{ inputs.tryb == 'na_zywo' && 'Na żywo' || 'Typer' }}

on:
  push:
    paths: [".github/workflows/typer.yml", "docs/data/kursy_vps.json"]   # kursy_vps.json zapisuje polski serwer → tylko dopisanie kursów
  schedule:
    - cron: "10 5 * * *"   # 7:10 czasu polskiego latem (wiadomość na Telegram ok. 8:00)
    - cron: "10 6 * * *"   # 7:10 czasu polskiego zimą (program sam pomija zbędne uruchomienie)
    - cron: "27 5,6 * * *"   # wersja 53: zapasowe poranne terminy (GitHub potrafi zgubić uruchomienie)
    - cron: "51 5,6 * * *"
    - cron: "15,45 6-22 * * *"   # co 30 min: składy i kursy przed meczami, rozliczenia, podsumowanie wieczorne
  workflow_dispatch:
    inputs:
      tryb:
        description: "puste = typy i sprawdzenia; na_zywo = powiadomienia na żywo"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  typy:
    if: inputs.tryb != 'na_zywo'
    concurrency:
      group: typer-v59   # wersja 57: nowa nazwa grupy omija uruchomienie zawieszone w kolejce („Queued” od 05.10 11:32)
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # zawsze najnowszy stan (uruchomienie czekające w kolejce nie może pracować na starych danych)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Policz typy
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BIGBALLS_KEY: ${{ secrets.BIGBALLS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_FOOTBALL_PRO: ${{ vars.API_FOOTBALL_PRO }}
          ADRES_APLIKACJI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PLATNY_PLAN: ${{ vars.PLATNY_PLAN }}
          GH_TOKEN: ${{ github.token }}
          TYPER_TRYB: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Kursy VPS')) && 'kursy' || inputs.tryb }}
        run: python typer/run_daily.py
      - name: Kursy polskich bukmacherów (Superbet)
        continue-on-error: true
        timeout-minutes: 6
        run: python typer/kursy_pl.py || true
      - name: Centrum (przejrzystość, historia prognoz i kursów, alerty, raport)
        continue-on-error: true
        timeout-minutes: 4
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python typer/centrum.py || true
      - name: Kontrola zdrowia (AI, kursy, serwer)
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python typer/zdrowie.py || true
      - name: Zapisz wyniki
        id: zapis
        run: |
          git config user.name "typer-bot"
          git config user.email "typer-bot@users.noreply.github.com"
          rm -rf typer/__pycache__   # wersja 50: pliki pośrednie Pythona nie trafiają do repozytorium
          git add -A typer docs requirements.txt README.md
          if git diff --cached --quiet; then echo "zmiany=0" >> "$GITHUB_OUTPUT"; else
            git commit -m "Typy $(date -u +%F\ %H:%M)"
            for i in 1 2 3 4; do
              if git pull -q --rebase; then git push -q && break
              else
                # konflikt z innym zapisem: pliki tego uruchomienia wygrywają w całości (bez znaczników <<<<<<< w danych)
                pliki=$(git diff --name-only --diff-filter=U)
                [ -n "$pliki" ] && git checkout --theirs -- $pliki && git add -- $pliki
                GIT_EDITOR=true git rebase --continue || git rebase --abort
                git push -q && break
              fi
              sleep 7
            done
            echo "zmiany=1" >> "$GITHUB_OUTPUT"; fi
      - name: Kontrola danych przed publikacją
        if: steps.zapis.outputs.zmiany == '1'
        run: |
          # gdyby w plikach zostały znaczniki konfliktu, publikujemy czysty stan z repozytorium
          if grep -rlE '^(<<<<<<<|>>>>>>>) ' docs; then
            echo "Znaleziono znaczniki konfliktu – publikuję stan z origin/main"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git checkout origin/main -- docs
          fi
      - uses: actions/configure-pages@v5
        if: steps.zapis.outputs.zmiany == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.zapis.outputs.zmiany == '1'
        with:
          path: docs
      - id: deploy
        if: steps.zapis.outputs.zmiany == '1'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Chwila przerwy przed ponowną publikacją
        if: steps.zapis.outputs.zmiany == '1' && steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        name: Ponowna publikacja strony (gdy GitHub nie zdążył udostępnić paczki)
        if: steps.zapis.outputs.zmiany == '1' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Strażnik na żywo: start, gole i koniec meczów z Pewne/Value i obserwowanych 🔔 – uruchamiany automatycznie przez program
  na_zywo:
    if: inputs.tryb == 'na_zywo'
    concurrency:
      group: typer-na-zywo
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Tożsamość git (wersja 60 – bez niej rebase przy zapisie stanu strażnika padał i stan przepadał)
        run: |
          git config user.name "typer-bot"
          git config user.email "typer-bot@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Powiadomienia na żywo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADRES_APLIKACJI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_TOKEN: ${{ github.token }}
        run: python typer/na_zywo.py

  # Wersja 59: STRAŻNIK – osobne zadanie bez kolejki. Dotąd jedno zawieszone uruchomienie („Queued”) blokowało wszystkie następne
  # (05.10 i 07.10 ok. 13:00 – dzień bez typów i bez Telegrama). Strażnik startuje przy każdym zaplanowanym uruchomieniu i przy każdym
  # zapisie kursów z polskiego serwera: anuluje zawieszone uruchomienia, a gdy brakuje dzisiejszych typów – sam uruchamia pełne liczenie
  # i wysyła ostrzeżenie na Telegram.
  straznik:
    if: inputs.tryb != 'na_zywo'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Strażnik – zawieszone uruchomienia i brak dzisiejszych typów
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BIEZACE: ${{ github.run_id }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime as dt, urllib.request, urllib.parse
          from zoneinfo import ZoneInfo
          R = os.environ['REPO']; JA = int(os.environ['BIEZACE'])
          def gh(*a):
              p = subprocess.run(['gh', 'api', *a], capture_output=True, text=True)
              return p.returncode, p.stdout, p.stderr
          teraz = dt.datetime.now(dt.timezone.utc); lok = teraz.astimezone(ZoneInfo('Europe/Warsaw'))
          def wiek(s):
              return (teraz - dt.datetime.fromisoformat(s.replace('Z', '+00:00'))).total_seconds() / 60
          wiadomosci = []
          zywe = []; kolejka = []; zacięte = []
          for st in ('in_progress', 'queued', 'waiting', 'pending', 'requested'):
              rc, o, e = gh(f'repos/{R}/actions/runs?status={st}&per_page=60')
              if rc: print('lista uruchomień:', st, e[:200]); continue
              for r in json.loads(o).get('workflow_runs', []):
                  if r['id'] == JA or 'typer.yml' not in (r.get('path') or ''): continue
                  if (r.get('display_title') or '') == 'Na żywo': continue
                  (zywe if st == 'in_progress' else kolejka).append(r)
          for r in zywe:
              w = wiek(r.get('run_started_at') or r['created_at'])
              if w > 55: zacięte.append((r, f'trwa {int(w)} min'))
          for r in kolejka:
              w = wiek(r['created_at'])
              if w > 15 and not zywe: zacięte.append((r, f'czeka w kolejce {int(w)} min'))
              elif w > 70: zacięte.append((r, f'czeka w kolejce {int(w)} min'))
          anulowane = 0
          for r, powod in zacięte:
              rc, o, e = gh('-X', 'POST', f'repos/{R}/actions/runs/{r["id"]}/cancel')
              if rc: rc, o, e = gh('-X', 'POST', f'repos/{R}/actions/runs/{r["id"]}/force-cancel')
              print('anuluję', r['id'], r.get('event'), powod, '→', 'ok' if not rc else e[:150])
              anulowane += 0 if rc else 1
          zostalo = [r for r in zywe + kolejka if r['id'] not in [z[0]['id'] for z in zacięte]]
          def plik(sciezka):
              rc, o, e = gh('-H', 'Accept: application/vnd.github.raw', f'repos/{R}/contents/{sciezka}?ref=main')
              try: return json.loads(o) if not rc else {}
              except Exception: return {}
          dzis = plik('docs/data/dzis.json'); stat = plik('docs/data/status.json')
          dzis_ok = dzis.get('data') == lok.strftime('%Y-%m-%d')
          try:
              ost = dt.datetime.strptime(stat.get('ostatnie_uruchomienie'), '%Y-%m-%d %H:%M').replace(tzinfo=ZoneInfo('Europe/Warsaw'))
              cisza = (teraz - ost).total_seconds() / 60
          except Exception: cisza = 9999
          minuta = lok.hour * 60 + lok.minute
          brak_typow = 8 * 60 + 20 <= minuta < 23 * 60 and not dzis_ok
          zaległe = 7 * 60 <= minuta < 23 * 60 and cisza > 75
          print(f'teraz {lok:%Y-%m-%d %H:%M}, typy na dziś: {dzis_ok}, od ostatniego sprawdzenia: {int(cisza)} min, w toku/kolejce: {len(zostalo)}')
          uruchomiono = False
          if (brak_typow or zaległe) and not zostalo:
              rc, o, e = gh(f'repos/{R}/actions/workflows/typer.yml/runs?event=workflow_dispatch&per_page=30')
              reczne = []
              try: reczne = [r for r in json.loads(o).get('workflow_runs', []) if (r.get('display_title') or '') != 'Na żywo'] if not rc else []
              except Exception: pass
              dzisiaj = [r for r in reczne if wiek(r['created_at']) < 24 * 60 and r['created_at'][:10] == teraz.strftime('%Y-%m-%d')]
              ostatnie = min([wiek(r['created_at']) for r in reczne] or [9999])
              if ostatnie > 35 and len(dzisiaj) < 5:
                  rc, o, e = gh('-X', 'POST', f'repos/{R}/actions/workflows/typer.yml/dispatches', '-f', 'ref=main')
                  print('uruchamiam pełne liczenie →', 'ok' if not rc else e[:200]); uruchomiono = not rc
              else: print('pomijam: ostatnie ręczne uruchomienie', int(ostatnie), 'min temu, dziś', len(dzisiaj))
          if anulowane:
              wiadomosci.append(f'🛠 Strażnik: anulowałem {anulowane} zawieszone uruchomienie(a) programu.')
          if uruchomiono:
              wiadomosci.append('🛠 Strażnik: brak dzisiejszych typów' + (' (program milczał ponad godzinę)' if zaległe and dzis_ok else '') + ' – uruchamiam pełne liczenie. Typy i powiadomienia powinny dojść w ciągu kilkunastu minut.')
          tok, chat = os.environ.get('TELEGRAM_TOKEN'), os.environ.get('TELEGRAM_CHAT_ID')
          if wiadomosci and tok and chat:
              try:
                  dane = urllib.parse.urlencode({'chat_id': chat, 'text': '\n'.join(wiadomosci)}).encode()
                  urllib.request.urlopen(urllib.request.Request(f'https://api.telegram.org/bot{tok}/sendMessage', data=dane), timeout=20)
              except Exception as e: print('Telegram:', e)
          PY
