# Typer – aplikacja z typami. Ten jeden plik instaluje i codziennie uruchamia całą aplikację.
name: Typer

on:
  push:
    paths: [".github/workflows/typer.yml"]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: typer
  cancel-in-progress: false

jobs:
  typy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
