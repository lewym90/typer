          KONIEC
          tar xzf /tmp/app.tgz -C /tmp/app
          mkdir -p typer docs/data
          cp -r /tmp/app/typer/. typer/
          cp /tmp/app/requirements.txt /tmp/app/README.md .
          cp /tmp/app/docs/index.html /tmp/app/docs/manifest.json docs/; cp /tmp/app/docs/*.png docs/ 2>/dev/null || true
