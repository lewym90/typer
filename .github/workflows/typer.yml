# Typer – aplikacja z typami. Ten jeden plik instaluje i codziennie uruchamia całą aplikację.
name: Typer

on:
  push:
    paths: [".github/workflows/typer.yml"]
  schedule:
    - cron: "0 10 * * *"   # 12:00 czasu polskiego latem
    - cron: "0 11 * * *"   # 12:00 czasu polskiego zimą (program sam pomija zbędne uruchomienie)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: typer
  cancel-in-progress: false

jobs:
  typy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
