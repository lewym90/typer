# Typer – aplikacja z typami (wersja 27: rozpoznanie zakładek rynków meczu Betclic PL (Wynik, Gole, Sety…), UFC i KSW, test pobierania bez przeglądarki (tryb --betclic2); wersja 26: rozpoznanie całej oferty Betclic PL na polskim serwerze – wszystkie sporty i wszystkie rodzaje zakładów, nasze mecze u Betclic (tryb --betclic); wersja 25: w analizie ręcznej zawsze ocena AI – zgoda z faworytem / ryzyko niespodzianki / AI odradza – z powodem i ocenianym typem; wersja 24: analiza AI przy każdym meczu z Pewnych i Value przez cały dzień (uzupełniana co 30 min, pamięć raportów), budżet Gemini 100 zł/mies. liczony z tokenów, analiza AI przy ręcznej analizie meczu (serwer AI na VPS), ładne kafelki kursów przy wyższym i ryzykownym typie, ponowienie publikacji strony; wersja 23: przy każdym zakładzie komplet kafelków bukmacherów (STS, Fortuna, Superbet, Betclic; „—” = brak w ofercie), STS – pełna oferta wszystkich meczów (subskrypcje paczkami z ponowieniem), Fortuna – „min. 1 set” obu zawodników; na Telegramie typy raz dziennie i zapowiedź ok. godzinę przed meczem z Pewnych i Value; czytelne wyniki po meczu; wersja 22: Fortuna – gole, gole drużyn, handicap i „wynik + gole”, STS – handicap i „wynik + gole”, kursy z polskiego serwera trafiają do aplikacji kilka minut po odczycie; wersja 21: liczenie typów ok. 7:10 i wiadomość ok. 8:00, doba = mecze zaczynające się od 8:00 do 6:00; wersja 20: kursy Fortuny i STS od razu przy nowych typach – liczenie czeka na polski serwer; wersja 19: nowy wygląd, AI z wyszukiwaniem Google ocenia każdy typ, próg 70%, KSW z kursów polskich bukmacherów; wersja 18: STS – pełne rynki meczu). Ten jeden plik instaluje i codziennie uruchamia całą aplikację.
name: Typer
run-name: ${{ inputs.tryb == 'na_zywo' && 'Na żywo' || 'Typer' }}

on:
  push:
    paths: [".github/workflows/typer.yml", "docs/data/kursy_vps.json"]   # kursy_vps.json zapisuje polski serwer → tylko dopisanie kursów
  schedule:
    - cron: "10 5 * * *"   # 7:10 czasu polskiego latem (wiadomość na Telegram ok. 8:00)
    - cron: "10 6 * * *"   # 7:10 czasu polskiego zimą (program sam pomija zbędne uruchomienie)
    - cron: "15,45 6-22 * * *"   # co 30 min: składy i kursy przed meczami, rozliczenia, podsumowanie wieczorne
  workflow_dispatch:
    inputs:
      tryb:
        description: "puste = typy i sprawdzenia; na_zywo = powiadomienia na żywo"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  typy:
    if: inputs.tryb != 'na_zywo'
    concurrency:
      group: typer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj aplikacje
