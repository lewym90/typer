# Typer – aplikacja z typami (wersja 5: piłka, tenis, MMA, boks). Ten jeden plik instaluje i codziennie uruchamia całą aplikację.
name: Typer
run-name: ${{ inputs.tryb == 'na_zywo' && 'Na żywo' || 'Typer' }}

on:
  push:
    paths: [".github/workflows/typer.yml"]
  schedule:
    - cron: "0 10 * * *"   # 12:00 czasu polskiego latem
    - cron: "0 11 * * *"   # 12:00 czasu polskiego zimą (program sam pomija zbędne uruchomienie)
    - cron: "15,45 10-22 * * *"   # co 30 min: składy i kursy przed meczami, rozliczenia, podsumowanie wieczorne
  workflow_dispatch:
    inputs:
      tryb:
        description: "puste = typy i sprawdzenia; na_zywo = powiadomienia na żywo"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  typy:
    if: inputs.tryb != 'na_zywo'
    concurrency:
      group: typer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj aplikacje
        run: |
          mkdir -p /tmp/app
