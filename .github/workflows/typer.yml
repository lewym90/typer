      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Policz typy
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BIGBALLS_KEY: ${{ secrets.BIGBALLS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_FOOTBALL_PRO: ${{ vars.API_FOOTBALL_PRO }}
          ADRES_APLIKACJI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PLATNY_PLAN: ${{ vars.PLATNY_PLAN }}
          GH_TOKEN: ${{ github.token }}
          TYPER_TRYB: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Kursy VPS')) && 'kursy' || inputs.tryb }}
        run: python typer/run_daily.py
      - name: Kursy polskich bukmacherów (Superbet)
        continue-on-error: true
        timeout-minutes: 6
        run: python typer/kursy_pl.py || true
      - name: Zapisz wyniki
        id: zapis
        run: |
          git config user.name "typer-bot"
          git config user.email "typer-bot@users.noreply.github.com"
          git add -A typer docs requirements.txt README.md
          if git diff --cached --quiet; then echo "zmiany=0" >> "$GITHUB_OUTPUT"; else
            git commit -m "Typy $(date -u +%F\ %H:%M)"
            for i in 1 2 3 4; do
              if git pull -q --rebase; then git push -q && break
              else
                # konflikt z innym zapisem: pliki tego uruchomienia wygrywają w całości (bez znaczników <<<<<<< w danych)
                pliki=$(git diff --name-only --diff-filter=U)
                [ -n "$pliki" ] && git checkout --theirs -- $pliki && git add -- $pliki
                GIT_EDITOR=true git rebase --continue || git rebase --abort
                git push -q && break
              fi
              sleep 7
            done
            echo "zmiany=1" >> "$GITHUB_OUTPUT"; fi
      - name: Kontrola danych przed publikacją
        if: steps.zapis.outputs.zmiany == '1'
        run: |
          # gdyby w plikach zostały znaczniki konfliktu, publikujemy czysty stan z repozytorium
          if grep -rlE '^(<<<<<<<|>>>>>>>) ' docs; then
            echo "Znaleziono znaczniki konfliktu – publikuję stan z origin/main"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git checkout origin/main -- docs
          fi
      - uses: actions/configure-pages@v5
        if: steps.zapis.outputs.zmiany == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.zapis.outputs.zmiany == '1'
        with:
          path: docs
      - id: deploy
        if: steps.zapis.outputs.zmiany == '1'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Chwila przerwy przed ponowną publikacją
        if: steps.zapis.outputs.zmiany == '1' && steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        name: Ponowna publikacja strony (gdy GitHub nie zdążył udostępnić paczki)
        if: steps.zapis.outputs.zmiany == '1' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Strażnik na żywo: start, gole i koniec meczów z Pewne/Value i obserwowanych 🔔 – uruchamiany automatycznie przez program
  na_zywo:
    if: inputs.tryb == 'na_zywo'
    concurrency:
      group: typer-na-zywo
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Powiadomienia na żywo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADRES_APLIKACJI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_TOKEN: ${{ github.token }}
        run: python typer/na_zywo.py
