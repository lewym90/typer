      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Policz typy
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PLATNY_PLAN: ${{ vars.PLATNY_PLAN }}
        run: python typer/run_daily.py
      - name: Zapisz wyniki
        run: |
          git config user.name "typer-bot"
          git config user.email "typer-bot@users.noreply.github.com"
          git add -A typer docs requirements.txt README.md
          git diff --cached --quiet || git commit -m "Typy $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
